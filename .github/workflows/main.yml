name: KJail OS

on:
  workflow_dispatch: # Esto te permite activar la compilación manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar mi código fuente
      uses: actions/checkout@v4

    - name: Instalar herramientas de compilación
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc

    - name: Generar configuración básica
      run: make defconfig # Esto genera una configuración base estable

    - name: Compilar el Kernel
      run: make -j$(nproc) bzImage

    - name: Subir mi Kernel terminado
      uses: actions/upload-artifact@v4
      with:
        name: kernel-jailblox
        path: arch/x86/boot/bzImage
